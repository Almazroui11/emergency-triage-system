<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Audit Log</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/i18n.js}"></script>
	<script th:src="@{/js/settings.js}"></script>
</head>

<body data-theme="light">
	<div class="app-shell">

		<div th:replace="sidebar :: sidebar"></div>

		<main class="main-wrap">
			<div class="top-card" style="justify-content:flex-end;">
				<form th:action="@{/logout}" method="post">
					<input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
						th:value="${_csrf != null ? _csrf.token : ''}">
					<button class="logout-btn" type="submit">Logout</button>
				</form>
			</div>

			<section class="card">
				<h3 class="card-title">Audit Log</h3>
				<p class="card-sub">System activity records</p>

				<div class="table-wrap">
					<table>
						<thead>
							<tr>
								<th>ID</th>
								<th>User</th>
								<th>Action</th>
								<th>Entity</th>
								<th>Time</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="l : ${logs}">
								<td th:text="${l.id}">1</td>
								<td th:text="${l.username}">admin</td>
								<td th:text="${l.action}">CREATE</td>
								<td th:text="${l.entityName}">Patient</td>
								<td th:text="${l.createdAt}">Time</td>
							</tr>

							<tr th:if="${#lists.isEmpty(logs)}">
								<td colspan="5" class="empty">No audit records.</td>
							</tr>
						</tbody>
					</table>
				</div>
			</section>
		</main>
	</div>
</body>

</html>
