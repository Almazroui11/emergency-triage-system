<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/i18n.js}"></script>
    <script th:src="@{/js/settings.js}"></script>
</head>
<body data-theme="light">
<div class="app-shell">
    <div th:replace="sidebar :: sidebar"></div>

    <main class="main-wrap">
        <div class="top-card">
			<div class="top-card-left">
			    <div class="top-text">
			        <h1>Patients</h1>
			        <p></p>
			    </div>
			</div>

            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                       th:value="${_csrf != null ? _csrf.token : ''}">
                <button class="logout-btn" type="submit" data-i18n="logout">Logout</button>
            </form>
        </div>

        <section class="card">
            <div class="patients-header">
                <div>
                    <h3 class="card-title" data-i18n="patients">Patients</h3>
                    <p class="card-sub" data-i18n="patientsSubtitle"></p>
                </div>

                <div class="action-row">
                    <a class="btn primary" th:href="@{/patients/new}" data-i18n="newPatient">New Patient</a>
                    <a class="btn" th:href="@{/export/patients.csv}" data-i18n="exportCsv">Export CSV</a>
                </div>
            </div>

            <form method="get" th:action="@{/patients}" class="search-panel">
                <div class="search-grid">
                    <div class="field full">
                        <label>Search</label>
                        <input type="text" name="q" th:value="${q}" placeholder="Search by full name, code, symptoms, complaint">
                    </div>

                    <div class="field">
                        <label>Category</label>
                        <select name="category">
                            <option value="">All Categories</option>
                            <option value="RED" th:selected="${category == 'RED'}">RED</option>
                            <option value="YELLOW" th:selected="${category == 'YELLOW'}">YELLOW</option>
                            <option value="GREEN" th:selected="${category == 'GREEN'}">GREEN</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Status</label>
                        <select name="status">
                            <option value="">All Status</option>
                            <option value="Waiting" th:selected="${status == 'Waiting'}">Waiting</option>
                            <option value="Archived" th:selected="${status == 'Archived'}">Archived</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Gender</label>
                        <select name="gender">
                            <option value="">All Genders</option>
                            <option value="Male" th:selected="${gender == 'Male'}">Male</option>
                            <option value="Female" th:selected="${gender == 'Female'}">Female</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Code</label>
                        <input type="text" name="code" th:value="${code}" placeholder="Patient code">
                    </div>
                </div>

                <div class="action-row" style="margin-top:18px;">
                    <button class="btn primary" type="submit">Search</button>
                    <a class="btn" th:href="@{/patients}">Reset</a>
                </div>
            </form>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th data-i18n="id">ID</th>
                        <th data-i18n="code">Code</th>
                        <th data-i18n="name">Name</th>
                        <th data-i18n="gender">Gender</th>
                        <th data-i18n="age">Age</th>
                        <th data-i18n="status">Status</th>
                        <th data-i18n="category">Category</th>
                        <th data-i18n="actions">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${patients}">
                        <td th:text="${p.id}">1</td>
                        <td th:text="${p.patientCode}">P-001</td>
                        <td th:text="${p.fullName}">Patient</td>
                        <td th:text="${p.gender}">Male</td>
                        <td th:text="${p.age}">25</td>
                        <td th:text="${p.status}">Waiting</td>
                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(p.category,'RED')}" class="badge red">RED</span>
                            <span th:if="${#strings.equalsIgnoreCase(p.category,'YELLOW')}" class="badge yellow">YELLOW</span>
                            <span th:if="${#strings.equalsIgnoreCase(p.category,'GREEN')}" class="badge green">GREEN</span>
                            <span th:if="${p.category == null or p.category == ''}" class="badge">-</span>
                        </td>
                        <td>
                            <div class="action-row">
                                <a class="btn" th:href="@{'/patients/' + ${p.id}}">Details</a>
                                <a class="btn" th:href="@{'/triage/' + ${p.id}}">Triage</a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="8" class="empty">No patients found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
