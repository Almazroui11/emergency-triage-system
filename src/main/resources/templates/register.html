<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/i18n.js}"></script>
    <script th:src="@{/js/settings.js}"></script>
</head>
<body class="landing-body">
<section class="landing-page">
    <div class="landing-overlay"></div>

    <div class="landing-content" style="justify-content:center;">
        <div class="login-card">
            <h1 data-i18n="register">Register</h1>
            <p>Create a new account request. Your request will wait for admin approval.</p>

            <form th:action="@{/register}" th:object="${pending}" method="post">
                <div class="field">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required>
                </div>

                <div class="field">
                    <label data-i18n="username">Username</label>
                    <input type="text" th:field="*{username}" required>
                </div>

                <div class="field">
                    <label data-i18n="password">Password</label>
                    <input type="password" th:field="*{password}" required>
                </div>

                <div class="field">
                    <label>Role</label>
                    <select th:field="*{requestedRole}">
                        <option value="NURSE">NURSE</option>
                        <option value="DOCTOR">DOCTOR</option>
                    </select>
                </div>

                <div class="login-actions">
                    <button type="submit" class="btn primary">Submit request</button>
                    <a th:href="@{/login}" class="btn light" data-i18n="back">Back</a>
                </div>

                <div class="msg" th:if="${msg != null}">
                    <div class="alert ok" th:text="${msg}">Message</div>
                </div>
            </form>
        </div>
    </div>

    <div class="landing-wave">
        <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,160L60,154.7C120,149,240,139,360,138.7C480,139,600,149,720,154.7C840,160,960,160,1080,144C1200,128,1320,96,1380,80L1440,64L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
        </svg>
    </div>
</section>
</body>
</html>
